[defaults]
inventory = inventory/hosts.yml
roles_path = roles
private_key_file = ~/.ssh/gcp_spark

# Performance: Increase parallel execution
forks = 10

# Performance: Enable fact caching (smart gathering)
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 3600

# Better output
stdout_callback = default
callbacks_enabled = timer, profile_tasks
bin_ansible_callbacks = true

# Disable deprecation warnings
deprecation_warnings = False

# Use YAML-style output
[defaults:vars]
ANSIBLE_STDOUT_CALLBACK = default
ANSIBLE_CALLBACK_RESULT_FORMAT = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=3600s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
