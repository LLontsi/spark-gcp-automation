---
# Common tasks for all nodes

- name: Install common packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - dnsutils
      - unzip
      - tar
      - python3
      - build-essential
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Install pip for Python 3 (Debian/Ubuntu)
  ansible.builtin.shell: |
    if ! command -v pip3 &> /dev/null; then
      curl -sS https://bootstrap.pypa.io/get-pip.py | python3
    fi
  become: true
  when: ansible_os_family == "Debian"
  changed_when: false

- name: Install common packages (RedHat/CentOS)
  ansible.builtin.yum:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - bind-utils  # equivalent to dnsutils
      - unzip
      - tar
      - python3
      - python3-pip
      - "@Development Tools"  # equivalent to build-essential
    state: present
  become: true
  when: ansible_os_family == "RedHat"

- name: Set locale
  ansible.builtin.locale_gen:
    name: "{{ locale }}"
    state: present
  become: true

- name: Disable swap for better Spark performance
  ansible.builtin.command: swapoff -a
  become: true
  changed_when: false
  ignore_errors: true

- name: Comment out swap in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'
  become: true

- name: Set system limits for Spark
  ansible.builtin.pam_limits:
    domain: "*"
    limit_type: "{{ item.limit_type }}"
    limit_item: "{{ item.limit_item }}"
    value: "{{ item.value }}"
  loop:
    - { limit_type: 'soft', limit_item: 'nofile', value: '65536' }
    - { limit_type: 'hard', limit_item: 'nofile', value: '65536' }
    - { limit_type: 'soft', limit_item: 'nproc', value: '32768' }
    - { limit_type: 'hard', limit_item: 'nproc', value: '32768' }
  become: true

- name: Create spark directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: '/tmp/spark-events', mode: '1777' }
    - { path: '/var/run/spark', mode: '0755' }
    - { path: '/var/log/spark', mode: '0755' }
  become: true

- name: Create sample data file for testing
  ansible.builtin.copy:
    dest: /tmp/sample.txt
    content: |
      Apache Spark is a unified analytics engine for large-scale data processing.
      Spark provides high-level APIs in Java, Scala, Python and R.
      It also supports a rich set of higher-level tools including Spark SQL.
      MLlib for machine learning, GraphX for graph processing.
      Structured Streaming for incremental computation and stream processing.
      Apache Spark achieves high performance for both batch and streaming data.
    mode: '0644'
    owner: root
    group: root
  become: true

- name: Install Python packages for Spark
  ansible.builtin.pip:
    name:
      - pyspark
      - py4j
    state: present
  become: true

