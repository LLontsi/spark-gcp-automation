---
# Configure Spark Edge node (client for job submission)

- name: Install additional Python packages for PySpark
  ansible.builtin.pip:
    name:
      - pyspark
      - py4j
      - numpy
      - pandas
    state: present
  become: true

- name: Create user home directory for scripts
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/spark-jobs
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Create WordCount test script
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env python3
      """
      WordCount Application for Apache Spark
      Tests the Spark cluster deployment
      """
      import sys
      import time
      from pyspark.sql import SparkSession

      def main(input_path, output_path):
          # Create Spark session
          spark = SparkSession.builder \
              .appName("WordCount") \
              .getOrCreate()

          try:
              # Start timer
              t1 = int(time.time() * 1000)

              # Read input file
              text_file = spark.sparkContext.textFile(input_path)

              # WordCount logic
              counts = text_file \
                  .flatMap(lambda line: line.split()) \
                  .map(lambda word: (word.lower(), 1)) \
                  .reduceByKey(lambda a, b: a + b)

              # Sort by count (descending)
              sorted_counts = counts.sortBy(lambda x: x[1], ascending=False)

              # Save results
              sorted_counts.saveAsTextFile(output_path)

              # End timer
              t2 = int(time.time() * 1000)

              print("=" * 50)
              print(f"time in ms: {t2 - t1}")
              print("=" * 50)

              # Print top 20 words
              top_words = sorted_counts.take(20)
              print("\nTop 20 words:")
              for word, count in top_words:
                  print(f"  {word}: {count}")

          except Exception as e:
              print(f"Error during WordCount execution: {e}")
              sys.exit(1)
          finally:
              spark.stop()

      if __name__ == "__main__":
          if len(sys.argv) != 3:
              print("Usage: wordcount.py <input_path> <output_path>")
              sys.exit(1)

          input_file = sys.argv[1]
          output_file = sys.argv[2]
          main(input_file, output_file)
    dest: /home/{{ ansible_user }}/spark-jobs/wordcount.py
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Create WordCount test runner script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      set -e

      MASTER_URL="spark://{{ spark_master_ip }}:{{ spark_master_port }}"
      INPUT="${1:-/tmp/sample.txt}"
      OUTPUT="${2:-/tmp/wordcount-output}"

      echo "Running WordCount test..."
      echo "Master: $MASTER_URL"
      echo "Input: $INPUT"
      echo "Output: $OUTPUT"

      # Clean old output
      rm -rf "$OUTPUT"

      # Dynamic executor configuration based on cluster size
      # Count available workers by querying Spark master
      NUM_WORKERS=$(curl -s "http://{{ spark_master_ip }}:{{ spark_master_webui_port }}/json/" | grep -o '"workers":\s*\[[^]]*\]' | grep -o '"id"' | wc -l || echo "2")

      # Fallback if curl fails
      if [ "$NUM_WORKERS" -eq 0 ]; then
        NUM_WORKERS=2
        echo "  Could not detect workers, using default: $NUM_WORKERS"
      fi

      # Worker specs (n1-standard-4: 4 vCPU, 15GB RAM)
      CORES_PER_WORKER=4
      MEMORY_PER_WORKER=15  # GB

      # Calculate executor settings
      # Strategy: 1 executor per worker, use 75% of resources
      NUM_EXECUTORS=$NUM_WORKERS
      EXECUTOR_CORES=$((CORES_PER_WORKER * 75 / 100))  # 3 cores
      EXECUTOR_MEMORY=$((MEMORY_PER_WORKER * 75 / 100))  # 11GB

      # Ensure minimums
      [ "$EXECUTOR_CORES" -lt 1 ] && EXECUTOR_CORES=1
      [ "$EXECUTOR_MEMORY" -lt 1 ] && EXECUTOR_MEMORY=1

      echo ""
      echo " Cluster Configuration:"
      echo "   Workers detected: $NUM_WORKERS"
      echo "   Executors: $NUM_EXECUTORS"
      echo "   Cores per executor: $EXECUTOR_CORES"
      echo "   Memory per executor: ${EXECUTOR_MEMORY}G"
      echo ""

      # Run WordCount
      spark-submit \
          --master "$MASTER_URL" \
          --deploy-mode client \
          --executor-memory "${EXECUTOR_MEMORY}G" \
          --executor-cores "$EXECUTOR_CORES" \
          --num-executors "$NUM_EXECUTORS" \
          /home/{{ ansible_user }}/spark-jobs/wordcount.py \
          "$INPUT" \
          "$OUTPUT"

      echo ""
      echo "WordCount completed!"
      echo "Results in: $OUTPUT"
      echo ""
      echo "To view results:"
      echo "  1. List all output files:"
      echo "     ls -lh $OUTPUT/"
      echo ""
      echo "  2. View word counts (part files contain the results):"
      echo "     cat $OUTPUT/part-*"
      echo ""
      echo "  3. View top 10 results:"
      echo "     cat $OUTPUT/part-* | sort -t':' -k2 -nr | head -10"
      echo ""
    dest: /home/{{ ansible_user }}/spark-jobs/run_wordcount.sh
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Create cluster info script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      echo "======================================"
      echo "  Spark Cluster Information"
      echo "======================================"
      echo ""
      echo "Spark Master:"
      echo "  URL: spark://{{ spark_master_ip }}:{{ spark_master_port }}"
      echo "  Web UI: http://{{ spark_master_ip }}:{{ spark_master_webui_port }}"
      echo ""
      echo "Workers:"
      {% for host in groups['workers'] %}
      echo "  {{ host }}: {{ hostvars[host]['ansible_host'] }}:{{ spark_worker_webui_port }}"
      {% endfor %}
      echo ""
      echo "To run WordCount test:"
      echo "  cd ~/spark-jobs"
      echo "  ./run_wordcount.sh"
      echo ""
    dest: /home/{{ ansible_user }}/cluster-info.sh
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Display cluster info
  ansible.builtin.debug:
    msg:
      - "Edge node configured successfully!"
      - "WordCount scripts location: /home/{{ ansible_user }}/spark-jobs/"
      - "Run: ssh {{ ansible_user }}@{{ ansible_default_ipv4.address }}"
      - "Then: cd ~/spark-jobs && ./run_wordcount.sh"
