---
# Configure Spark Edge node (client for job submission)

- name: Install additional Python packages for PySpark
  ansible.builtin.pip:
    name:
      - pyspark
      - py4j
      - numpy
      - pandas
    state: present
  become: true

- name: Create user home directory for scripts
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/spark-jobs
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Create WordCount test script
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env python3
      """
      WordCount Application for Apache Spark
      Tests the Spark cluster deployment
      """
      import sys
      import time
      from pyspark.sql import SparkSession

      def main(input_path, output_path):
          # Create Spark session
          spark = SparkSession.builder \
              .appName("WordCount") \
              .getOrCreate()

          try:
              # Start timer
              t1 = int(time.time() * 1000)

              # Read input file
              text_file = spark.sparkContext.textFile(input_path)

              # WordCount logic
              counts = text_file \
                  .flatMap(lambda line: line.split()) \
                  .map(lambda word: (word.lower(), 1)) \
                  .reduceByKey(lambda a, b: a + b)

              # Sort by count (descending)
              sorted_counts = counts.sortBy(lambda x: x[1], ascending=False)

              # Save results
              sorted_counts.saveAsTextFile(output_path)

              # End timer
              t2 = int(time.time() * 1000)

              print("=" * 50)
              print(f"time in ms: {t2 - t1}")
              print("=" * 50)

              # Print top 20 words
              top_words = sorted_counts.take(20)
              print("\nTop 20 words:")
              for word, count in top_words:
                  print(f"  {word}: {count}")

          except Exception as e:
              print(f"Error during WordCount execution: {e}")
              sys.exit(1)
          finally:
              spark.stop()

      if __name__ == "__main__":
          if len(sys.argv) != 3:
              print("Usage: wordcount.py <input_path> <output_path>")
              sys.exit(1)

          input_file = sys.argv[1]
          output_file = sys.argv[2]
          main(input_file, output_file)
    dest: /home/{{ ansible_user }}/spark-jobs/wordcount.py
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Create WordCount test runner script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      set -e

      MASTER_URL="spark://{{ spark_master_ip }}:{{ spark_master_port }}"
      INPUT="${1:-/tmp/sample.txt}"
      OUTPUT="${2:-/tmp/wordcount-output}"

      echo "Running WordCount test..."
      echo "Master: $MASTER_URL"
      echo "Input: $INPUT"
      echo "Output: $OUTPUT"

      # Clean old output
      rm -rf "$OUTPUT"

      # Dynamic executor configuration based on cluster size
      # Query Spark master and parse worker specs dynamically
      set +e
      JSON_RESP=$(curl -s --connect-timeout 2 "http://{{ spark_master_ip }}:{{ spark_master_webui_port }}/json/")
      CURL_EXIT=$?
      set -e

      NUM_WORKERS=0
      TOTAL_CORES=0
      TOTAL_MEMORY=0

      if [ $CURL_EXIT -eq 0 ] && [ -n "$JSON_RESP" ]; then
          # Parse only ALIVE workers and sum their resources
          # Use python3 for reliable JSON parsing
          if command -v python3 &> /dev/null; then
              read NUM_WORKERS TOTAL_CORES TOTAL_MEMORY <<< $(echo "$JSON_RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);w=[x for x in d.get("workers",[]) if x.get("state")=="ALIVE"];cores=sum(x.get("cores",0) for x in w);mem=sum(x.get("memory",0) for x in w)//1024;print(f"{len(w)} {cores} {mem}")' 2>/dev/null || echo "0 0 0")
          else
              # Fallback: basic grep-based counting (less accurate)
              NUM_WORKERS=$(echo "$JSON_RESP" | grep -o '"state"\s*:\s*"ALIVE"' | wc -l)
          fi
      fi
      
      # Fallback logic if detection failed
      if [ "$NUM_WORKERS" -eq 0 ] || [ "$TOTAL_CORES" -eq 0 ]; then
          echo "  [WARN] Failed to detect workers or resources"
          echo "  [WARN] Using safe defaults: 2 workers, 4 cores, 12GB each"
          NUM_WORKERS=2
          TOTAL_CORES=8
          TOTAL_MEMORY=24
      fi

      # Calculate executor settings based on detected resources
      # Strategy: 1 executor per worker, use 75% of available resources
      NUM_EXECUTORS=$NUM_WORKERS
      
      if [ "$NUM_WORKERS" -gt 0 ]; then
          EXECUTOR_CORES=$((TOTAL_CORES * 75 / 100 / NUM_WORKERS))
          EXECUTOR_MEMORY=$((TOTAL_MEMORY * 75 / 100 / NUM_WORKERS))
      else
          EXECUTOR_CORES=3
          EXECUTOR_MEMORY=11
      fi

      # Ensure minimums
      [ "$EXECUTOR_CORES" -lt 1 ] && EXECUTOR_CORES=1
      [ "$EXECUTOR_MEMORY" -lt 1 ] && EXECUTOR_MEMORY=1

      echo ""
      echo " Cluster Configuration:"
      echo "   Workers detected: $NUM_WORKERS (ALIVE)"
      echo "   Total resources: ${TOTAL_CORES} cores, ${TOTAL_MEMORY}GB RAM"
      echo "   Allocated (75%): $((TOTAL_CORES * 75 / 100)) cores, $((TOTAL_MEMORY * 75 / 100))GB RAM"
      echo "   Executors: $NUM_EXECUTORS"
      echo "   Per executor: ${EXECUTOR_CORES} cores, ${EXECUTOR_MEMORY}GB RAM"
      echo ""

      # Run WordCount
      spark-submit \
          --master "$MASTER_URL" \
          --deploy-mode client \
          --executor-memory "${EXECUTOR_MEMORY}G" \
          --executor-cores "$EXECUTOR_CORES" \
          --num-executors "$NUM_EXECUTORS" \
          /home/{{ ansible_user }}/spark-jobs/wordcount.py \
          "$INPUT" \
          "$OUTPUT"

      echo ""
      echo "WordCount completed!"
      echo "Results in: $OUTPUT"
      echo ""
      echo "To view results:"
      echo "  1. List all output files:"
      echo "     ls -lh $OUTPUT/"
      echo ""
      echo "  2. View word counts (part files contain the results):"
      echo "     cat $OUTPUT/part-*"
      echo ""
      echo "  3. View top 10 results:"
      echo "     cat $OUTPUT/part-* | sort -t':' -k2 -nr | head -10"
      echo ""
    dest: /home/{{ ansible_user }}/spark-jobs/run_wordcount.sh
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Create cluster info script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      echo "======================================"
      echo "  Spark Cluster Information"
      echo "======================================"
      echo ""
      echo "Spark Master:"
      echo "  URL: spark://{{ spark_master_ip }}:{{ spark_master_port }}"
      echo "  Web UI: http://{{ spark_master_ip }}:{{ spark_master_webui_port }}"
      echo ""
      echo "Workers:"
      {% for host in groups['workers'] %}
      echo "  {{ host }}: {{ hostvars[host]['ansible_host'] }}:{{ spark_worker_webui_port }}"
      {% endfor %}
      echo ""
      echo "To run WordCount test:"
      echo "  cd ~/spark-jobs"
      echo "  ./run_wordcount.sh"
      echo ""
    dest: /home/{{ ansible_user }}/cluster-info.sh
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Display cluster info
  ansible.builtin.debug:
    msg:
      - "Edge node configured successfully!"
      - "WordCount scripts location: /home/{{ ansible_user }}/spark-jobs/"
      - "Run: ssh {{ ansible_user }}@{{ ansible_default_ipv4.address }}"
      - "Then: cd ~/spark-jobs && ./run_wordcount.sh"
