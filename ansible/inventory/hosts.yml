# Inventory file for GCP
# This file is automatically generated by the update_inventory.sh script when the infrastructure is deployed
# Do not modify this file manually
---
all:
  children:
    spark_cluster:
      children:
        master:
          hosts:
            spark-master:
              ansible_host: IP_MASTER

        workers:
          hosts:
            spark-worker-1:
              ansible_host: IP_WORKER_1
            spark-worker-2:
              ansible_host: IP_WORKER_2
            spark-worker-3:
              ansible_host: IP_WORKER_3

        edge:
          hosts:
            spark-edge:
              ansible_host:  IP_EDGE

  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/gcp_spark
