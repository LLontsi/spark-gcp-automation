---
# Main playbook to configure Spark cluster

- name: Wait for SSH connection
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 60

- name: Load global variables
  hosts: all
  gather_facts: false
  tasks:
    - name: Include global vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all.yml"
    - name: Include cluster vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/spark-cluster.yml"

- name: Configure all nodes with common settings
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/spark-cluster.yml
  roles:
    - common
    - monitoring-common
    - java
    - spark-common

- name: Configure Spark Master
  hosts: master
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/spark-cluster.yml
  roles:
    - spark-master
    - prometheus
    - grafana

- name: Configure Spark Workers
  hosts: workers
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/spark-cluster.yml
  roles:
    - spark-worker

- name: Configure Spark Edge node
  hosts: edge
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/spark-cluster.yml
  roles:
    - spark-edge

- name: Display cluster summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Cluster deployment summary
      ansible.builtin.debug:
        msg:
          - "╔════════════════════════════════════════════════╗"
          - "║   Spark Cluster Configuration Complete!       ║"
          - "╚════════════════════════════════════════════════╝"
          - ""
          - "Spark deployment finished!"
          - "Check the Master UI for cluster status"
      when: groups['master'] is defined
