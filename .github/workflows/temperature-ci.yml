name: Temperature Analysis CI/CD

on:
  push:
    branches: [main, lado, lontsi]
    paths:
      - 'temperature/**'
      - '.github/workflows/temperature-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'temperature/**'
  workflow_dispatch:
    inputs:
      regenerate_data:
        description: 'Régénérer les données (2GB)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-and-analyze:
    name: Deploy & Analyze Temperature Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EDGE_SSH_PRIVATE_KEY }}

      - name: Add edge node to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EDGE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy temperature project to edge node
        run: |
          echo " Déploiement du projet temperature sur l'edge node..."
          
          # Créer le dossier sur l'edge si nécessaire
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} "mkdir -p ~/spark-jobs/temperature"
          
          # Copier tous les fichiers
          scp -r temperature/* ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}:~/spark-jobs/temperature/
          
          # Rendre les scripts exécutables
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} "chmod +x ~/spark-jobs/temperature/*.sh"
          
          echo " Déploiement terminé"

      - name: Verify HDFS connectivity
        run: |
          echo " Vérification HDFS..."
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            if /opt/hadoop/current/bin/hdfs dfs -test -e /user/spark 2>/dev/null; then
              echo " HDFS accessible"
            else
              echo " HDFS non accessible"
              exit 1
            fi
          EOF

      - name: Generate temperature data (if needed)
        run: |
          echo " Vérification/Génération des données..."
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            cd ~/spark-jobs/temperature
            
            HDFS_DATA_PATH="hdfs://10.0.0.10:9000/user/spark/temperature/data.csv"
            
            # Si workflow_dispatch avec regenerate_data=true, supprimer les anciennes données
            if [ "${{ github.event.inputs.regenerate_data }}" == "true" ]; then
              echo " Régénération forcée des données..."
              /opt/hadoop/current/bin/hdfs dfs -rm -r -f /user/spark/temperature/data.csv 2>/dev/null || true
            fi
            
            # Vérifier si données existent
            if /opt/hadoop/current/bin/hdfs dfs -test -e "$HDFS_DATA_PATH" 2>/dev/null; then
              FILE_SIZE=$(/opt/hadoop/current/bin/hdfs dfs -du -h "$HDFS_DATA_PATH" | awk '{print $1, $2}')
              echo " Données existantes: $FILE_SIZE"
              echo "   Génération ignorée (utilisez workflow_dispatch pour forcer)"
            else
              echo "  Données manquantes, lancement génération..."
              ./generate_data.sh
            fi
          EOF

      - name: Run temperature analysis
        id: analyze
        run: |
          echo " Lancement analyse Spark..."
          echo ""
          
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            cd ~/spark-jobs/temperature
            
            # Supprimer anciens résultats
            /opt/hadoop/current/bin/hdfs dfs -rm -r -f /user/spark/temperature/results 2>/dev/null || true
            
            # Lancer l'analyse
            START_TIME=$(date +%s)
            
            /opt/spark/current/bin/spark-submit \
              --master spark://10.0.0.10:7077 \
              --deploy-mode client \
              --executor-memory 4G \
              --driver-memory 2G \
              --num-executors 4 \
              --executor-cores 1 \
              ./analyze_temperature.py 2>&1 | tee /tmp/spark_analysis.log
            
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            
            echo ""
            echo "  Temps d'exécution: ${DURATION}s"
          EOF

      - name: Retrieve results from HDFS
        id: results
        run: |
          echo " Récupération des résultats..."
          echo ""
          
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            # Récupérer le résultat texte
            echo " Résultat texte:"
            echo "═══════════════════════════════════════════════════════════"
            /opt/hadoop/current/bin/hdfs dfs -cat /user/spark/temperature/results/result.txt/part-00000
            echo "═══════════════════════════════════════════════════════════"
            echo ""
            
            # Récupérer le résultat JSON
            echo " Résultat JSON:"
            /opt/hadoop/current/bin/hdfs dfs -cat /user/spark/temperature/results/result.json/part-00000
          EOF

      - name: Download results artifacts
        run: |
          echo "Téléchargement des résultats..."
          
          # Créer dossier local pour résultats
          mkdir -p results
          
          # Télécharger les résultats depuis HDFS via SCP
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            # Copier depuis HDFS vers filesystem local
            /opt/hadoop/current/bin/hdfs dfs -get /user/spark/temperature/results/result.txt/part-00000 /tmp/result.txt
            /opt/hadoop/current/bin/hdfs dfs -get /user/spark/temperature/results/result.json/part-00000 /tmp/result.json
          EOF
          
          # Télécharger via SCP
          scp ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}:/tmp/result.txt results/
          scp ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}:/tmp/result.json results/
          
          echo " Résultats téléchargés"

      - name: Upload results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: temperature-analysis-results-${{ github.run_number }}
          path: results/
          retention-days: 30

      - name: Parse and display results
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "             RÉSULTATS DE L'ANALYSE"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          
          if [ -f results/result.json ]; then
            # Extraire les informations clés du JSON
            HOTTEST_YEAR=$(cat results/result.json | grep -o '"hottest_year": [0-9]*' | grep -o '[0-9]*')
            HOTTEST_TEMP=$(cat results/result.json | grep -o '"hottest_avg_temperature": [0-9.]*' | grep -o '[0-9.]*')
            EXEC_TIME=$(cat results/result.json | grep -o '"execution_time_seconds": [0-9.]*' | grep -o '[0-9.]*')
            TOTAL_RECORDS=$(cat results/result.json | grep -o '"total_records": [0-9]*' | grep -o '[0-9]*')
            
            echo " Année la plus chaude  : $HOTTEST_YEAR"
            echo "  Température moyenne   : ${HOTTEST_TEMP}°C"
            echo "  Temps d'exécution     : ${EXEC_TIME}s"
            echo " Total de mesures      : $TOTAL_RECORDS"
            echo ""
            echo "═══════════════════════════════════════════════════════════"
            echo ""
            echo " Résultat complet :"
            cat results/result.txt
          else
            echo "  Fichier résultat non trouvé"
            exit 1
          fi

      - name: Create job summary
        if: always()
        run: |
          echo "#  Analyse des Températures - Résultats" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f results/result.json ]; then
            HOTTEST_YEAR=$(cat results/result.json | grep -o '"hottest_year": [0-9]*' | grep -o '[0-9]*')
            HOTTEST_TEMP=$(cat results/result.json | grep -o '"hottest_avg_temperature": [0-9.]*' | grep -o '[0-9.]*')
            EXEC_TIME=$(cat results/result.json | grep -o '"execution_time_seconds": [0-9.]*' | grep -o '[0-9.]*')
            TOTAL_RECORDS=$(cat results/result.json | grep -o '"total_records": [0-9]*' | grep -o '[0-9]*')
            
            echo "##  Résultat Principal" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Métrique | Valeur |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "|  **Année la plus chaude** | **$HOTTEST_YEAR** |" >> $GITHUB_STEP_SUMMARY
            echo "|  Température moyenne | ${HOTTEST_TEMP}°C |" >> $GITHUB_STEP_SUMMARY
            echo "|  Temps d'exécution | ${EXEC_TIME}s |" >> $GITHUB_STEP_SUMMARY
            echo "|  Total de mesures | $(printf "%'d" $TOTAL_RECORDS) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "##  Détails par Année" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat results/result.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "##  Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Les résultats complets sont disponibles dans les artifacts de ce workflow." >> $GITHUB_STEP_SUMMARY
          else
            echo " **Erreur**: Impossible de récupérer les résultats" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultText = fs.readFileSync('results/result.txt', 'utf8');
            const resultJson = JSON.parse(fs.readFileSync('results/result.json', 'utf8'));
            
            const comment = `## 🌡️ Résultats de l'Analyse des Températures
            
            ### 🎯 Résultat Principal
            
            | Métrique | Valeur |
            |----------|--------|
            |  **Année la plus chaude** | **${resultJson.hottest_year}** |
            |  Température moyenne | ${resultJson.hottest_avg_temperature}°C |
            |  Temps d'exécution | ${resultJson.execution_time_seconds}s |
            |  Total de mesures | ${resultJson.total_records.toLocaleString()} |
            
            ###  Détails par Année
            
            \`\`\`
            ${resultText}
            \`\`\`
            
            ---
            *Workflow run: #${{ github.run_number }}*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  cleanup:
    name: Cleanup old artifacts
    runs-on: ubuntu-latest
    if: always()
    needs: deploy-and-analyze
    
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const oldArtifacts = artifacts.data.artifacts
              .filter(artifact => artifact.name.startsWith('temperature-analysis-results-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(5); // Garder les 5 plus récents
            
            for (const artifact of oldArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name}`);
            }