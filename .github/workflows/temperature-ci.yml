name: Temperature Analysis CI/CD

on:
  push:
    branches: [main, lado, lontsi]
    paths:
      - 'temperature/**'
      - '.github/workflows/temperature-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'temperature/**'
  workflow_dispatch:
    inputs:
      regenerate_data:
        description: 'Regenerate data (100MB)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-and-analyze:
    name: Deploy & Analyze Temperature Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EDGE_SSH_PRIVATE_KEY }}

      - name: Add edge node to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EDGE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy temperature project to edge node
        run: |
          echo "Deploying temperature project to edge node..."
          
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} "mkdir -p ~/spark-jobs/temperature"
          
          scp -r temperature/* ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}:~/spark-jobs/temperature/
          
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} "chmod +x ~/spark-jobs/temperature/*.sh"
          
          echo "Deployment completed"

      - name: Verify HDFS connectivity
        run: |
          echo "Verifying HDFS connectivity..."
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            if /opt/hadoop/current/bin/hdfs dfs -test -e /user/spark 2>/dev/null; then
              echo "HDFS is accessible"
            else
              echo "ERROR: HDFS not accessible"
              exit 1
            fi
          EOF

      - name: Generate temperature data (if needed)
        run: |
          echo "Checking/Generating temperature data..."
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            cd ~/spark-jobs/temperature
            
            HDFS_DATA_PATH="hdfs://10.0.0.10:9000/user/spark/temperature/data.csv"
            
            if [ "${{ github.event.inputs.regenerate_data }}" == "true" ]; then
              echo "Forced data regeneration requested..."
              /opt/hadoop/current/bin/hdfs dfs -rm -r -f /user/spark/temperature/data.csv 2>/dev/null || true
            fi
            
            if /opt/hadoop/current/bin/hdfs dfs -test -e "$HDFS_DATA_PATH" 2>/dev/null; then
              FILE_SIZE=$(/opt/hadoop/current/bin/hdfs dfs -du -h "$HDFS_DATA_PATH" | awk '{print $1, $2}')
              echo "Existing data found: $FILE_SIZE"
              echo "Skipping generation (use workflow_dispatch to force)"
            else
              echo "No data found, starting generation..."
              ./generate_data.sh
            fi
          EOF

      - name: Run temperature analysis
        id: analyze
        run: |
          echo "Starting Spark analysis..."
          echo ""
          
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            cd ~/spark-jobs/temperature
            
            /opt/hadoop/current/bin/hdfs dfs -rm -r -f /user/spark/temperature/results 2>/dev/null || true
            
            START_TIME=$(date +%s)
            
            /opt/spark/current/bin/spark-submit \
              --master spark://10.0.0.10:7077 \
              --deploy-mode client \
              --executor-memory 4G \
              --driver-memory 2G \
              --num-executors 4 \
              --executor-cores 1 \
              ./analyze_temperature.py 2>&1 | tee /tmp/spark_analysis.log
            
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            
            echo ""
            echo "Execution time: ${DURATION}s"
          EOF

      - name: Verify results in HDFS
        run: |
          echo "Verifying results in HDFS..."
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            echo "HDFS results structure:"
            /opt/hadoop/current/bin/hdfs dfs -ls -R /user/spark/temperature/results/
            
            echo ""
            echo "Checking result.txt:"
            if /opt/hadoop/current/bin/hdfs dfs -test -e /user/spark/temperature/results/result.txt/part-00000; then
              echo "result.txt exists"
            else
              echo "ERROR: result.txt missing"
              exit 1
            fi
            
            echo ""
            echo "Checking result.json:"
            if /opt/hadoop/current/bin/hdfs dfs -test -e /user/spark/temperature/results/result.json/part-00000; then
              echo "result.json exists"
            else
              echo "ERROR: result.json missing"
              exit 1
            fi
          EOF

      - name: Download results from HDFS to edge
        run: |
          echo "Downloading results from HDFS to edge node..."
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            echo "Cleaning temporary files..."
            rm -f /tmp/result.txt /tmp/result.json
            
            echo "Copying from HDFS..."
            /opt/hadoop/current/bin/hdfs dfs -get -f /user/spark/temperature/results/result.txt/part-00000 /tmp/result.txt
            /opt/hadoop/current/bin/hdfs dfs -get -f /user/spark/temperature/results/result.json/part-00000 /tmp/result.json
            
            echo ""
            echo "Files copied:"
            ls -lh /tmp/result.txt /tmp/result.json
            
            echo ""
            echo "File sizes:"
            du -h /tmp/result.txt /tmp/result.json
            
            echo ""
            echo "result.json preview:"
            head -3 /tmp/result.json
            
            echo ""
            echo "result.txt preview:"
            head -10 /tmp/result.txt
          EOF

      - name: Download results to GitHub runner
        run: |
          echo "Downloading results to GitHub runner..."
          
          mkdir -p results
          
          scp ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}:/tmp/result.txt results/result.txt
          scp ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}:/tmp/result.json results/result.json
          
          echo ""
          echo "Files downloaded to results/"
          ls -lh results/
          
          echo ""
          echo "Verifying result.json:"
          if [ -f results/result.json ]; then
            cat results/result.json
            echo ""
            echo "result.json is present and readable"
          else
            echo "ERROR: result.json missing!"
            exit 1
          fi
          
          echo ""
          echo "Verifying result.txt:"
          if [ -f results/result.txt ]; then
            echo "result.txt is present ($(wc -l < results/result.txt) lines)"
            head -5 results/result.txt
          else
            echo "ERROR: result.txt missing!"
            exit 1
          fi

      - name: Display results in console
        run: |
          echo "Retrieving results from HDFS..."
          echo ""
          
          ssh ${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }} << 'EOF'
            echo "Text result:"
            echo "==========================================================="
            /opt/hadoop/current/bin/hdfs dfs -cat /user/spark/temperature/results/result.txt/part-00000
            echo "==========================================================="
            echo ""
            
            echo "JSON result:"
            /opt/hadoop/current/bin/hdfs dfs -cat /user/spark/temperature/results/result.json/part-00000
          EOF

      - name: Upload results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: temperature-analysis-results-${{ github.run_number }}
          path: results/
          retention-days: 30

      - name: Parse and display results
        run: |
          echo ""
          echo "==========================================================="
          echo "            ANALYSIS RESULTS"
          echo "==========================================================="
          echo ""
          
          if [ -f results/result.json ]; then
            HOTTEST_YEAR=$(cat results/result.json | grep -o '"hottest_year": [0-9]*' | grep -o '[0-9]*')
            HOTTEST_TEMP=$(cat results/result.json | grep -o '"hottest_avg_temperature": [0-9.]*' | grep -o '[0-9.]*')
            EXEC_TIME=$(cat results/result.json | grep -o '"execution_time_seconds": [0-9.]*' | grep -o '[0-9.]*')
            TOTAL_RECORDS=$(cat results/result.json | grep -o '"total_records": [0-9]*' | grep -o '[0-9]*')
            
            echo "Hottest year         : $HOTTEST_YEAR"
            echo "Average temperature  : ${HOTTEST_TEMP} C"
            echo "Execution time       : ${EXEC_TIME}s"
            echo "Total records        : $TOTAL_RECORDS"
            echo ""
            echo "==========================================================="
            echo ""
            echo "Complete result:"
            cat results/result.txt
          else
            echo "ERROR: Result file not found"
            exit 1
          fi

      - name: Create job summary
        if: always()
        run: |
          echo "# Temperature Analysis - Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f results/result.json ]; then
            HOTTEST_YEAR=$(cat results/result.json | grep -o '"hottest_year": [0-9]*' | grep -o '[0-9]*')
            HOTTEST_TEMP=$(cat results/result.json | grep -o '"hottest_avg_temperature": [0-9.]*' | grep -o '[0-9.]*')
            EXEC_TIME=$(cat results/result.json | grep -o '"execution_time_seconds": [0-9.]*' | grep -o '[0-9.]*')
            TOTAL_RECORDS=$(cat results/result.json | grep -o '"total_records": [0-9]*' | grep -o '[0-9]*')
            
            echo "## Main Result" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Hottest year** | **$HOTTEST_YEAR** |" >> $GITHUB_STEP_SUMMARY
            echo "| Average temperature | ${HOTTEST_TEMP} C |" >> $GITHUB_STEP_SUMMARY
            echo "| Execution time | ${EXEC_TIME}s |" >> $GITHUB_STEP_SUMMARY
            echo "| Total records | $(printf "%'d" $TOTAL_RECORDS) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "## Details by Year" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat results/result.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Complete results are available in workflow artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "**ERROR**: Unable to retrieve results" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultText = fs.readFileSync('results/result.txt', 'utf8');
            const resultJson = JSON.parse(fs.readFileSync('results/result.json', 'utf8'));
            
            const comment = `## Temperature Analysis Results
            
            ### Main Result
            
            | Metric | Value |
            |--------|-------|
            | **Hottest year** | **${resultJson.hottest_year}** |
            | Average temperature | ${resultJson.hottest_avg_temperature} C |
            | Execution time | ${resultJson.execution_time_seconds}s |
            | Total records | ${resultJson.total_records.toLocaleString()} |
            
            ### Details by Year
            
            \`\`\`
            ${resultText}
            \`\`\`
            
            ---
            *Workflow run: #${{ github.run_number }}*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  cleanup:
    name: Cleanup old artifacts
    runs-on: ubuntu-latest
    if: always()
    needs: deploy-and-analyze
    
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const oldArtifacts = artifacts.data.artifacts
              .filter(artifact => artifact.name.startsWith('temperature-analysis-results-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(5);
            
            for (const artifact of oldArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name}`);
            }