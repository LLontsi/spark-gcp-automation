name: General Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [lontsi, lado]

jobs:
  file-structure:
    name: Check File Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "Checking project structure..."
          test -d terraform || { echo "terraform/ directory missing"; exit 1; }
          test -d ansible || { echo "ansible/ directory missing"; exit 1; }
          test -d scripts || { echo "scripts/ directory missing"; exit 1; }
          test -d docs || { echo "docs/ directory missing"; exit 1; }
          test -f README.md || { echo "README.md missing"; exit 1; }
          test -f .gitignore || { echo ".gitignore missing"; exit 1; }
          echo "[SUCCESS] Project structure is valid"

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # ← Ajoutez cette ligne
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true
          format: sarif
          additional_args: --out tfsec-results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: tfsec-results.sarif

  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r scripts/ -f json -o bandit-report.json || true
          bandit -r scripts/
        continue-on-error: true

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          working_directory: ansible
        continue-on-error: true